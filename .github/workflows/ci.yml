name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: amp
          POSTGRES_PASSWORD: test_only_password
          PGPASSWORD: test_only_password
          POSTGRES_DB: amp_test
          POSTGRES_INITDB_ARGS: --auth=scram-sha-256
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U amp -d amp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://amp:test_only_password@localhost:5432/amp_test
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run check
      - run: node scripts/recovery-drill.mjs
      - run: npm run format:check
      - run: npm audit --audit-level=low
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
            docs/evidence/recovery.json
          retention-days: 14
  container:
    runs-on: ubuntu-24.04
    env:
      DOMAIN: classwork.invalid
      POSTGRES_PASSWORD: ci_container_fixture_only
      RELEASE_TAG: audit-${{ github.run_id }}
      COMPOSE_PROJECT_NAME: classwork-audit-${{ github.run_id }}
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose -f compose.production.yaml config --quiet
      - run: docker build --check .
      - run: docker compose -f compose.production.yaml build app
      - run: docker compose -f compose.production.yaml run --rm app node apps/api/dist/database/cli.js migrate
      - run: docker compose -f compose.production.yaml up -d --wait app
      - name: Verify production image and compiled assets
        run: |
          docker compose -f compose.production.yaml exec -T app node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import sharp from 'sharp';
          import { access } from 'node:fs/promises';
          execFileSync('ffmpeg', ['-version']);
          execFileSync('ffprobe', ['-version']);
          assert.ok(sharp.versions.vips);
          await access(process.env.ASSET_DIRECTORY);
          const origin = 'http://127.0.0.1:3100';
          const page = await fetch(origin);
          assert.equal(page.status, 200);
          assert.match(page.headers.get('content-security-policy'), /default-src 'self'/);
          const html = await page.text();
          assert.match(html, /Classwork/);
          const assets = [...html.matchAll(/(?:src|href)="([^" ]+\.(?:js|css))"/g)];
          assert.ok(assets.length >= 2);
          for (const [, asset] of assets) assert.equal((await fetch(new URL(asset, origin))).status, 200);
          assert.deepEqual(await (await fetch(`${origin}/api/health`)).json(), { status: 'ok' });
          assert.equal((await fetch(`${origin}/api/assignments`)).status, 401);
          console.log('Production container, migrations, headers, assets and API passed.');
          JS
      - name: Validate HTTPS proxy configuration
        run: docker run --rm -e DOMAIN -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Inspect container runtime logs
        if: always()
        run: docker compose -f compose.production.yaml logs --no-color app db
      - if: always()
        run: docker compose -f compose.production.yaml down --volumes --remove-orphans
