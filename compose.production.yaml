services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: classwork
      POSTGRES_USER: classwork
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U classwork -d classwork']
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    image: classwork:${RELEASE_TAG:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgresql://classwork:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/classwork
      WEB_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      TRUST_PROXY: 'true'
      SERVE_WEB: 'true'
      HOST: 0.0.0.0
      ALLOW_DEMO_SEED: 'false'
    depends_on:
      db:
        condition: service_healthy
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  pg_data:
  caddy_data:
  caddy_config:
