services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: amp
      POSTGRES_PASSWORD: amp_local_only
      POSTGRES_DB: amp
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - amp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U amp -d amp']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  amp-postgres:
